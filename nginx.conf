server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The pages are UTF-8 and carry a <meta charset>, but nginx otherwise sends
    # bare "text/html" and a browser that trusts the header over the document
    # renders the Chinese half of the page as mojibake. Say it in both places.
    charset       utf-8;
    charset_types text/html text/css application/javascript;

    # Traefik terminates TLS and forwards plain HTTP, so nginx's own view of the
    # scheme is "http". Left on, the trailing-slash 301 that `trailingSlash`
    # routes depend on (/sponsor -> /sponsor/) would name an absolute
    # http:// URL and bounce the visitor back out through Traefik's
    # HTTPS redirect. Relative Location headers keep the scheme the client used.
    absolute_redirect off;

    gzip              on;
    gzip_types        text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   6;

    # `output: 'export'` with trailingSlash emits a directory per route
    # (/sponsor/index.html, /dashboard/index.html, …), so the default
    # $uri/ lookup resolves every page without a rewrite rule each.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Links to the old built filename were circulated to sponsors before the
    # Next.js rebuild; keep them landing on the prospectus.
    location = /sponsor.built.html {
        return 301 /sponsor/;
    }

    # Hashed build output under /_next/static is immutable by construction.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted font files are content-hashed too.
    location /_next/static/media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every build rewrites the HTML wholesale, so don't let intermediaries
    # hold a stale copy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
