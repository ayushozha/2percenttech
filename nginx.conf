server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The pages are UTF-8 and carry a <meta charset>, but nginx otherwise sends
    # bare "text/html" and a browser that trusts the header over the document
    # renders the Chinese half of the page as mojibake. Say it in both places.
    charset       utf-8;
    charset_types text/html text/css application/javascript;

    # Pages are single files with fonts and logos inlined as base64 data URIs,
    # so they compress far better than their on-disk size suggests.
    gzip              on;
    gzip_types        text/html text/css application/javascript;
    gzip_min_length   1024;
    gzip_comp_level   6;

    # Clean URL for the prospectus; the built filename stays reachable so
    # links already circulated as sponsor.built.html keep working.
    location = /sponsor {
        try_files /sponsor.built.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Every build rewrites both files wholesale, so don't let intermediaries
    # hold a stale copy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
